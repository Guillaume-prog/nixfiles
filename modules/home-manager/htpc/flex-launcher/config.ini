[General]
DefaultMenu=MainMenu

[Layout]
IconSpacing=10%
IconSize=192

[Background]
Mode=Image
Image=asset:background.png
Overlay=true

[Titles]
Font=asset:Iceland-Regular.ttf

[Highlight]
VPadding=32
HPadding=48
CornerRadius=16

[Gamepad]
Enabled=true
DeviceIndex=0
ControllerMappingsFile=/nixfiles/modules/home-manager/htpc/flex-launcher/controller_mappings.txt

[Hotkeys]
Hotkey1=#1B;:quit

[MainMenu]
Entry1=Steam;icon:steam.png;steam -gamepadui
Entry2=Plex;icon:plex.png;plex-htpc
Entry3=Youtube;icon:youtube.png;bash /nixfiles/modules/home-manager/htpc/flex-launcher/scripts/youtube-start.bash